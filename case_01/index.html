<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Que</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>JS Que</h1>

<div class="controls">
    <button id="startBtn">Start Que</button>
    <button id="stopBtn">Stop Que</button>
</div>

<main>
    <section id="queue-container">

        <div class="person"><img src="../assets/walk anim"><span class="label">A</span></div>
        <div class="person"><img src="../assets/walk anim"><span class="label">B</span></div>
        <div class="person"><img src="../assets/walk anim"><span class="label">C</span></div>
        <div class="person"><img src="../assets/walk anim"><span class="label">D</span></div>
        <div class="person"><img src="../assets/walk anim"><span class="label">E</span></div>
        <div class="person"><img src="../assets/walk anim"><span class="label">F</span></div>
    </section>

    <div id="house">
        <img src="../assets/img.png" alt="house">
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
